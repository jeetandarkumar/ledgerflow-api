name: LedgerFlow CI/CD

on:
  push:
    branches: [Dev]

  workflow_dispatch:
    inputs:
      deploy_env:
        description: "Select deployment target"
        required: true
        type: choice
        options:
          - UAT
          - PROD

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  actions: read

##############################################################################
# 🔵 STEP 1 — DEV (Auto on Dev push)
##############################################################################
jobs:
  dev:
    name: DEV - Unit Tests + Deploy
    runs-on: self-hosted
    if: github.ref == 'refs/heads/Dev'

    environment: DEV

    steps:
      - uses: actions/checkout@v4

      - name: Restore
        run: dotnet restore ledgerflowApi.sln

      - name: Build
        run: dotnet build ledgerflowApi.sln -c Release

      - name: Run Unit Tests
        run: |
          dotnet test tests/LedgerFlow.UnitTests/LedgerFlow.UnitTests.csproj `
            -c Release `
            --logger "trx;LogFileName=unit.trx" `
            --results-directory ./test-results `
            --collect:"XPlat Code Coverage" `
            --settings tests/coverlet.runsettings
        shell: powershell

      - name: Publish Unit Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit Tests
          path: "test-results/*.trx"
          reporter: dotnet-trx

      - name: Deploy DEV
        run: |
          dotnet publish src/ledgerflowApi.API/ledgerflowApi.API.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -o "D:\Projects\ledgerflowApi\DEV"
        shell: powershell


##############################################################################
# 🟡 STEP 2 — UAT (QA Approval Required)
##############################################################################
  uat:
    name: UAT - Integration Tests + Deploy
    runs-on: self-hosted
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_env == 'UAT'

    environment: UAT   # 🔥 QA approval gate happens in GitHub settings

    steps:
      - uses: actions/checkout@v4

      - name: Restore
        run: dotnet restore ledgerflowApi.sln

      - name: Build
        run: dotnet build ledgerflowApi.sln -c Release

      - name: Run Integration Tests
        run: |
          dotnet test tests/LedgerFlow.IntegrationTests/LedgerFlow.IntegrationTests.csproj `
            -c Release `
            --logger "trx;LogFileName=int.trx" `
            --results-directory ./test-results `
            --settings tests/coverlet.runsettings
        shell: powershell

      - name: Publish Integration Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Integration Tests
          path: "test-results/*.trx"
          reporter: dotnet-trx

      - name: Deploy UAT
        run: |
          dotnet publish src/ledgerflowApi.API/ledgerflowApi.API.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -o "D:\Projects\ledgerflowApi\UAT"
        shell: powershell


##############################################################################
# 🔴 STEP 3 — PROD (PM Approval Required)
##############################################################################
  prod:
    name: PROD - Deploy
    runs-on: self-hosted
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_env == 'PROD'

    environment: PROD   # 🔥 PM approval gate

    steps:
      - uses: actions/checkout@v4

      - name: Restore
        run: dotnet restore ledgerflowApi.sln

      - name: Build
        run: dotnet build ledgerflowApi.sln -c Release

      - name: Deploy PROD
        run: |
          dotnet publish src/ledgerflowApi.API/ledgerflowApi.API.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -o "D:\Projects\ledgerflowApi\PROD"
        shell: powershell