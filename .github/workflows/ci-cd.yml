name: LedgerFlow CI/CD

on:
  push:
    branches: [Dev, UAT, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  actions: read

jobs:

##############################################################################
# STEP 1 — BUILD + UNIT TESTS + DEV DEPLOY
##############################################################################
  dev-stage:
    name: Step 1 - Build, Unit Tests, Deploy DEV
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Restore
        run: dotnet restore ledgerflowApi.sln

      - name: Build
        run: |
          dotnet build ledgerflowApi.sln `
            --configuration Release `
            --no-restore
        shell: powershell

      # ---------------- UNIT TESTS ONLY ----------------
      - name: Run Unit Tests
        run: |
          dotnet test tests/LedgerFlow.UnitTests/LedgerFlow.UnitTests.csproj `
            --configuration Release `
            --no-build `
            --logger "trx;LogFileName=unit.trx" `
            --results-directory ./test-results `
            --collect:"XPlat Code Coverage" `
            --settings tests/coverlet.runsettings
        shell: powershell

      # ---------------- TEST REPORT ----------------
      - name: Publish Unit Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit Tests
          path: "test-results/*.trx"
          reporter: dotnet-trx

      # ---------------- DEV DEPLOY ----------------
      - name: Deploy DEV
        if: github.ref == 'refs/heads/Dev'
        shell: powershell
        run: |
          dotnet publish src/ledgerflowApi.API/ledgerflowApi.API.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            /p:PublishProfile=DEV


##############################################################################
# STEP 2 — INTEGRATION TESTS + UAT DEPLOY
##############################################################################
  uat-stage:
    name: Step 2 - Integration Tests + Deploy UAT
    runs-on: self-hosted
    needs: dev-stage

    steps:
      - uses: actions/checkout@v4

      # ---------------- INTEGRATION TESTS ----------------
      - name: Run Integration Tests
        run: |
          dotnet test tests/LedgerFlow.IntegrationTests/LedgerFlow.IntegrationTests.csproj `
            --configuration Release `
            --no-build `
            --logger "trx;LogFileName=int.trx" `
            --results-directory ./test-results `
            --settings tests/coverlet.runsettings
        shell: powershell

      - name: Publish Integration Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Integration Tests
          path: "test-results/*.trx"
          reporter: dotnet-trx

      # ---------------- UAT DEPLOY ----------------
      - name: Deploy UAT
        if: github.ref == 'refs/heads/UAT'
        shell: powershell
        run: |
          dotnet publish src/ledgerflowApi.API/ledgerflowApi.API.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            /p:PublishProfile=UAT


##############################################################################
# STEP 3 — PRODUCTION DEPLOYMENT
##############################################################################
  prod-stage:
    name: Step 3 - Deploy Production
    runs-on: self-hosted
    needs: uat-stage

    steps:
      - uses: actions/checkout@v4

      - name: Deploy PROD
        if: github.ref == 'refs/heads/main'
        shell: powershell
        run: |
          dotnet publish src/ledgerflowApi.API/ledgerflowApi.API.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            /p:PublishProfile=PROD