name: LedgerFlow CI/CD

on:
  push:
    branches: [Dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  checks: write
  actions: read

jobs:

  ##############################################################################
  # STEP 1 — DEV (Auto on Dev push)
  ##############################################################################
  dev:
    name: DEV - Unit Tests + Deploy
    runs-on: self-hosted
    environment: DEV

    steps:
      - uses: actions/checkout@v4

      - name: Restore
        run: dotnet restore ledgerflowApi.sln

      - name: Build
        run: dotnet build ledgerflowApi.sln -c Release

      - name: Run Unit Tests
        run: |
          dotnet test tests/LedgerFlow.UnitTests/LedgerFlow.UnitTests.csproj `
            --configuration Release `
            --no-build `
            --logger "trx;LogFileName=unit.trx" `
            --results-directory ./test-results `
            --collect:"XPlat Code Coverage" `
            --settings tests/coverlet.runsettings
        shell: powershell

      - name: Publish Unit Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit Tests
          path: "test-results/*.trx"
          reporter: dotnet-trx

      - name: Deploy DEV
        shell: powershell
        run: |
          dotnet publish src/ledgerflowApi.API/ledgerflowApi.API.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -o "D:\Projects\ledgerflowApi\DEV"


  ##############################################################################
  # STEP 2 — UAT
  ##############################################################################
  uat:
    name: UAT - Integration Tests + Deploy
    runs-on: self-hosted
    needs: dev
    environment: UAT

    outputs:
      promoted_sha: ${{ steps.promote.outputs.promoted_sha }}

    steps:
      - uses: actions/checkout@v4

      # Promote only the commit that triggered this workflow.
      - name: Promote Dev commit to UAT
        id: promote
        shell: powershell
        run: |
          git fetch origin Dev UAT

          git checkout UAT
          git reset --hard origin/UAT

          git cherry-pick $env:GITHUB_SHA

          git push origin UAT

          $promotedSha = (git rev-parse HEAD).Trim()
          "promoted_sha=$promotedSha" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore ledgerflowApi.sln

      - name: Build
        run: dotnet build ledgerflowApi.sln -c Release

      - name: Run Integration Tests
        run: |
          dotnet test tests/LedgerFlow.IntegrationTests/LedgerFlow.IntegrationTests.csproj `
            --configuration Release `
            --no-build `
            --logger "trx;LogFileName=int.trx" `
            --results-directory ./test-results `
            --settings tests/coverlet.runsettings
        shell: powershell

      - name: Publish Integration Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Integration Tests
          path: "test-results/*.trx"
          reporter: dotnet-trx

      - name: Deploy UAT
        shell: powershell
        run: |
          dotnet publish src/ledgerflowApi.API/ledgerflowApi.API.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -o "D:\Projects\ledgerflowApi\UAT"


  ##############################################################################
  # STEP 3 — PROD
  ##############################################################################
  prod:
    name: PROD - Deploy
    runs-on: self-hosted
    needs: uat
    environment: PROD

    steps:
      - uses: actions/checkout@v4

      # Promote only the exact commit that successfully passed UAT.
      - name: Promote UAT commit to Main
        shell: powershell
        run: |
          git fetch origin UAT main

          git checkout main
          git reset --hard origin/main

          git cherry-pick ${{ needs.uat.outputs.promoted_sha }}

          git push origin main

      - name: Restore
        run: dotnet restore ledgerflowApi.sln

      - name: Build
        run: dotnet build ledgerflowApi.sln -c Release

      - name: Deploy PROD
        shell: powershell
        run: |
          dotnet publish src/ledgerflowApi.API/ledgerflowApi.API.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -o "D:\Projects\ledgerflowApi\PROD"